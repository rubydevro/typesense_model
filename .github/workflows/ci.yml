name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: "Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit specs
        run: bundle exec rake

  integration:
    name: "Integration (live Typesense)"
    runs-on: ubuntu-latest
    services:
      typesense:
        image: typesense/typesense:0.25.2
        ports:
          - 8108:8108
        env:
          TYPESENSE_API_KEY: test-key
          TYPESENSE_DATA_DIR: /tmp/typesense-data
        options: >-
          --health-cmd "curl -sf http://localhost:8108/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run integration specs
        env:
          TYPESENSE_INTEGRATION: "1"
          TYPESENSE_API_KEY: test-key
          TYPESENSE_HOST: localhost
          TYPESENSE_PORT: "8108"
          TYPESENSE_PROTOCOL: http
        run: bundle exec rspec --tag integration
